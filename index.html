<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#008080"><meta name="description" content="A little nostalgia. A blank canvas. Spectacle Paint, right on your desktop.">
<title>Untitled - Paint</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="native.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='8' width='23' height='20' rx='9' fill='%23eedda2' stroke='%23000'/%3E%3Ccircle cx='12' cy='13' r='2' fill='red'/%3E%3Ccircle cx='21' cy='13' r='2' fill='blue'/%3E%3Cpath d='M10 26L22 3l4 2-12 23z' fill='%23926940' stroke='%23000'/%3E%3C/svg%3E">
</head>
<body class="native-program">
<main class="desktop">
  <button class="desktop-icon" id="desktop-paint" aria-label="Open Paint"><span data-icon="paint"></span><span>Paint</span></button>
  <section class="paint-window" id="paint-window" aria-label="Spectacle Paint application">
    <header class="titlebar"><span class="app-mark" data-icon="paint"></span><span id="window-title">Untitled - Paint</span><div class="window-actions"><button id="minimize" title="Minimize" aria-label="Minimize">🗕</button><button id="maximize" title="Maximize" aria-label="Maximize"><span class="maximize-icon"></span></button><button id="close-window" title="Close" aria-label="Close">×</button></div></header>
    <nav class="menubar" aria-label="Application menu" id="menubar"></nav>
    <div class="editor">
      <aside class="toolbox" id="toolbox" aria-label="Drawing tools"><div class="tool-grid" id="tools"></div><div class="tool-options" id="tool-options" aria-label="Tool options"></div><div class="toolbox-grip"></div></aside>
      <div class="workspace" id="workspace" aria-label="Drawing workspace">
        <div class="canvas-wrap" id="canvas-wrap"><canvas id="canvas" width="900" height="560" aria-label="Drawing canvas"></canvas><canvas id="overlay" width="900" height="560" aria-label="Draw here" tabindex="0"></canvas><span class="resize-handle east" title="Drag to resize canvas"></span><span class="resize-handle south" title="Drag to resize canvas"></span><span class="resize-handle corner" title="Drag to resize canvas"></span><div class="canvas-size-tag" id="canvas-size-tag">900 × 560 px</div></div>
        <span class="workspace-hint">A blank canvas. Just like the good old days.</span>
      </div>
    </div>
    <section class="colors" id="colorbox" aria-label="Color palette"><button class="current-colors" id="swap-colors" title="Swap foreground and background colors (X)" aria-label="Swap foreground and background colors"><span class="color-back" id="color-back"></span><span class="color-front" id="color-front"></span></button><div class="swatches" id="swatches"></div><div class="palette-caption"><span>Left click: foreground</span><span>Right click: background</span></div><button class="custom-color" id="custom-color" title="Edit colors"><span class="color-rainbow"></span><span>Edit colors</span></button></section>
    <footer class="statusbar" id="statusbar"><span id="status-message">For Help, click Help Topics on the Help menu.</span><span class="status-position" id="status-position">0, 0 px</span><span id="status-size">900 × 560 px</span><label class="zoom-control" title="Zoom"><span class="zoom-symbol">⌕</span><select id="zoom-select" aria-label="Canvas zoom"><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option><option value="4">400%</option><option value="8">800%</option></select></label><span class="size-grip"></span></footer>
  </section>
  <div class="desktop-note"><span>Paint like it’s 1998.</span><span>No accounts. No distractions. Just pixels.</span></div>
</main>
<footer class="taskbar"><button class="start-button" id="start-button" aria-label="Start menu"><span class="windows-flag"><i></i><i></i><i></i><i></i></span><b>Start</b></button><span class="taskbar-divider"></span><button class="task-button active" id="task-paint"><span data-icon="paint"></span><b>Untitled - Paint</b></button><div class="system-tray"><span class="speaker-icon" aria-hidden="true">◖))</span><time id="clock">12:00 PM</time></div></footer>
<div class="start-menu" id="start-menu" hidden><span class="start-rail">Windows <b>98</b></span><div><button data-action="restore"><span data-icon="paint"></span>Paint</button><button data-action="help">Help Topics</button><hr><button data-action="about">About Classic Paint</button></div></div>
<input type="file" id="open-file" accept="image/*" hidden>
<dialog id="dialog"><form method="dialog" id="dialog-form"><div class="dialog-title"><span id="dialog-title">Paint</span><button type="button" id="dialog-close" aria-label="Close dialog">×</button></div><div class="dialog-content" id="dialog-content"></div><div class="dialog-actions" id="dialog-actions"></div></form></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="icons.js"></script><script src="engine.js"></script><script src="app.js"></script>
</body></html>
